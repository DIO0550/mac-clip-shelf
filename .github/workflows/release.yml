name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and create release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project clip-shelf/clip-shelf.xcodeproj \
            -scheme clip-shelf \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release/clip-shelf.app"
          SAFE_TAG_NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE_PATH="dist/clip-shelf-${SAFE_TAG_NAME}.zip"

          test -d "$APP_PATH"
          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SAFE_TAG_NAME="${GITHUB_REF_NAME//\//-}"
          ARCHIVE_PATH="dist/clip-shelf-${SAFE_TAG_NAME}.zip"

          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" \
            --title "clip-shelf ${GITHUB_REF_NAME}" \
            --generate-notes
